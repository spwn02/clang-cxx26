name: Reference Toolchain Snapshot

on:
  push:
    tags:
      - "cxx26-*"

permissions:
  contents: read
  actions: read

concurrency:
  group: reference-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      snapshot: ${{ steps.metadata.outputs.snapshot }}
      revision: ${{ steps.metadata.outputs.revision }}
      publish: ${{ steps.metadata.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve snapshot metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          revision="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          trigger_tag="$GITHUB_REF_NAME"

          git fetch --no-tags --depth=1 origin cxx26:refs/remotes/origin/cxx26
          cxx26_tip="$(git rev-parse refs/remotes/origin/cxx26)"

          if [[ "$revision" != "$cxx26_tip" ]]; then
            echo "Reference-toolchain tags must point at the current cxx26 tip." >&2
            echo "tagged revision: $revision" >&2
            echo "cxx26 tip:       $cxx26_tip" >&2
            exit 1
          fi

          if [[ "$trigger_tag" =~ ^cxx26-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            snapshot="$trigger_tag"
            publish=true

            git fetch --force --no-tags --depth=1 origin \
              "refs/tags/${trigger_tag}:refs/tags/${trigger_tag}"

            if [[ "$(git cat-file -t "refs/tags/$trigger_tag")" != "tag" ]]; then
              echo "Published reference snapshots require an annotated Git tag." >&2
              exit 1
            fi

            tag_commit="$(git rev-parse "refs/tags/$trigger_tag^{commit}")"

            if [[ "$tag_commit" != "$revision" ]]; then
              echo "Checked-out revision does not match annotated tag target." >&2
              exit 1
            fi

          elif [[ "$trigger_tag" =~ ^cxx26-preflight-[A-Za-z0-9._-]+$ ]]; then
            snapshot="cxx26-dev-${revision:0:12}"
            publish=false
          else
            echo "Unsupported reference-toolchain tag: $trigger_tag" >&2
            exit 1
          fi

          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Compute compiler source fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail

          source_fingerprint="$(
            {
              for path in \
                llvm \
                clang \
                lld \
                libcxx \
                libcxxabi \
                libunwind \
                runtimes \
                cmake \
                third-party \
                pstl
              do
                if git cat-file -e "HEAD:${path}" 2>/dev/null; then
                  printf '%s %s\n' \
                    "$path" \
                    "$(git rev-parse "HEAD:${path}")"
                fi
              done
            } | sha256sum | cut -d' ' -f1
          )"

          echo "source=$source_fingerprint" >> "$GITHUB_OUTPUT"
          echo "recipe=${{ hashFiles('cxx26/toolchain/build-linux-x86_64.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache ninja-build zstd

          python3 -m pip install --user "cmake==4.4.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Find reusable build artifacts
        id: reusable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_NAME: cxx26-stage-linux-x86_64-v2-${{ steps.fingerprint.outputs.source }}-${{ steps.fingerprint.outputs.recipe }}
          CCACHE_NAME: cxx26-ccache-linux-x86_64-v2
        run: |
          set -euo pipefail

          find_latest_artifact() {
            local name="$1"
            gh api \
              -X GET \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              -f "name=${name}" \
              -f "per_page=100" \
              --jq '
                [.artifacts[]
                  | select(.expired == false)
                  | select(.workflow_run.id != '"${GITHUB_RUN_ID}"')]
                | sort_by(.created_at)
                | reverse
                | .[0]
                | if . == null
                  then empty
                  else [.id, .workflow_run.id] | @tsv
                  end
              '
          }

          stage_artifact="$(find_latest_artifact "$STAGE_NAME")"
          ccache_artifact="$(find_latest_artifact "$CCACHE_NAME")"

          if [[ -n "$stage_artifact" ]]; then
            IFS=$'\t' read -r stage_id stage_run_id <<< "$stage_artifact"
            echo "Found reusable staged toolchain artifact: $stage_id from run $stage_run_id"
            echo "stage-hit=true" >> "$GITHUB_OUTPUT"
            echo "stage-id=$stage_id" >> "$GITHUB_OUTPUT"
            echo "stage-run-id=$stage_run_id" >> "$GITHUB_OUTPUT"
          else
            echo "No exact staged toolchain artifact found."
            echo "stage-hit=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$ccache_artifact" ]]; then
            IFS=$'\t' read -r ccache_id ccache_run_id <<< "$ccache_artifact"
            echo "Found reusable rolling ccache artifact: $ccache_id from run $ccache_run_id"
            echo "ccache-hit=true" >> "$GITHUB_OUTPUT"
            echo "ccache-id=$ccache_id" >> "$GITHUB_OUTPUT"
            echo "ccache-run-id=$ccache_run_id" >> "$GITHUB_OUTPUT"
          else
            echo "No rolling ccache artifact found."
            echo "ccache-hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download staged reference toolchain
        if: steps.reusable.outputs.stage-hit == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.reusable.outputs.stage-id }}
          path: ${{ runner.temp }}/cxx26-stage-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reusable.outputs.stage-run-id }}

      - name: Restore staged reference toolchain
        if: steps.reusable.outputs.stage-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cxx26-stage"
          tar --use-compress-program=unzstd \
            -xf "$RUNNER_TEMP/cxx26-stage-artifact/cxx26-stage.tar.zst" \
            -C "$RUNNER_TEMP/cxx26-stage"

      # Migration bridge from the original tag-scoped cache design. Reusing
      # the same disposable preflight tag once lets us import its old cache and
      # republish it into the repository-level artifact store below.
      - name: Restore legacy tag-scoped staged cache
        id: legacy-stage
        if: steps.reusable.outputs.stage-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/cxx26-stage
          key: cxx26-stage-linux-x86_64-v1-${{ steps.fingerprint.outputs.source }}-${{ steps.fingerprint.outputs.recipe }}

      - name: Download rolling compiler cache
        if: steps.reusable.outputs.ccache-hit == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.reusable.outputs.ccache-id }}
          path: ${{ runner.temp }}/cxx26-ccache-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reusable.outputs.ccache-run-id }}

      - name: Restore rolling compiler cache
        if: steps.reusable.outputs.ccache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cxx26-ccache"
          tar --use-compress-program=unzstd \
            -xf "$RUNNER_TEMP/cxx26-ccache-artifact/cxx26-ccache.tar.zst" \
            -C "$RUNNER_TEMP/cxx26-ccache"

      - name: Restore legacy tag-scoped compiler cache
        id: legacy-ccache
        if: steps.reusable.outputs.ccache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/cxx26-ccache
          key: cxx26-ccache-linux-x86_64-v1-${{ steps.fingerprint.outputs.recipe }}-${{ steps.fingerprint.outputs.source }}
          restore-keys: |
            cxx26-ccache-linux-x86_64-v1-${{ steps.fingerprint.outputs.recipe }}-

      - name: Build reference toolchain
        id: toolchain-build
        if: steps.reusable.outputs.stage-hit != 'true' && steps.legacy-stage.outputs.cache-hit != 'true'
        shell: bash
        env:
          CXX26_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/cxx26-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats

          cxx26/toolchain/build-linux-x86_64.sh \
            "$RUNNER_TEMP/cxx26-stage" \
            "$RUNNER_TEMP/cxx26-build"

          ccache --show-stats

      - name: Archive staged reference toolchain
        if: steps.reusable.outputs.stage-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cxx26-stage-upload"
          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$RUNNER_TEMP/cxx26-stage" \
            -cf - . \
            | zstd -10 -T0 -o "$RUNNER_TEMP/cxx26-stage-upload/cxx26-stage.tar.zst"

      - name: Persist staged reference toolchain
        if: steps.reusable.outputs.stage-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: cxx26-stage-linux-x86_64-v2-${{ steps.fingerprint.outputs.source }}-${{ steps.fingerprint.outputs.recipe }}
          path: ${{ runner.temp }}/cxx26-stage-upload/cxx26-stage.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Archive rolling compiler cache
        if: (steps.reusable.outputs.ccache-hit != 'true' && steps.legacy-ccache.outputs.cache-hit == 'true') || steps.toolchain-build.outcome == 'success'
        shell: bash
        env:
          CCACHE_DIR: ${{ runner.temp }}/cxx26-ccache
        run: |
          set -euo pipefail
          ccache --cleanup
          ccache --show-stats

          mkdir -p "$RUNNER_TEMP/cxx26-ccache-upload"
          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$RUNNER_TEMP/cxx26-ccache" \
            -cf - . \
            | zstd -6 -T0 -o "$RUNNER_TEMP/cxx26-ccache-upload/cxx26-ccache.tar.zst"

      - name: Persist rolling compiler cache
        if: (steps.reusable.outputs.ccache-hit != 'true' && steps.legacy-ccache.outputs.cache-hit == 'true') || steps.toolchain-build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: cxx26-ccache-linux-x86_64-v2
          path: ${{ runner.temp }}/cxx26-ccache-upload/cxx26-ccache.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Package snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 cxx26/toolchain/package.py \
            --stage "$RUNNER_TEMP/cxx26-stage" \
            --output "$RUNNER_TEMP/cxx26-dist" \
            --snapshot "${{ steps.metadata.outputs.snapshot }}" \
            --revision "${{ steps.metadata.outputs.revision }}" \
            --source-date-epoch "${{ steps.metadata.outputs.source-date-epoch }}"

      - name: Upload preflight snapshot
        uses: actions/upload-artifact@v6
        with:
          name: reference-toolchain-${{ steps.metadata.outputs.snapshot }}
          path: ${{ runner.temp }}/cxx26-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Verify relocated Linux x86_64
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build zstd

          python3 -m pip install --user "cmake==4.4.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download candidate snapshot
        uses: actions/download-artifact@v7
        with:
          name: reference-toolchain-${{ needs.build.outputs.snapshot }}
          path: dist

      - name: Verify relocated package
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find dist -maxdepth 1 -name '*.tar.zst' -print -quit)"
          test -n "$archive"

          mkdir -p "$RUNNER_TEMP/cxx26-verify"
          tar --use-compress-program=unzstd \
            -xf "$archive" \
            -C "$RUNNER_TEMP/cxx26-verify"

          root="$(find "$RUNNER_TEMP/cxx26-verify" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"

          # shellcheck disable=SC1090
          source "$root/share/clang-cxx26/activate.sh"

          test -x "$CC"
          test -x "$CXX"
          test -x "$CXX26_TOOLCHAIN_ROOT/bin/clang-scan-deps"
          test -f "$CXX26_TOOLCHAIN_ROOT/share/clang-cxx26/manifest.json"

          modules_manifest="$("$CXX" -print-file-name=libc++.modules.json)"
          test -f "$modules_manifest"

          cmake \
            -S cxx26/toolchain/smoke \
            -B "$RUNNER_TEMP/cxx26-smoke-build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$CXX26_CMAKE_TOOLCHAIN_FILE"

          cmake --build "$RUNNER_TEMP/cxx26-smoke-build"
          "$RUNNER_TEMP/cxx26-smoke-build/CXX26ReferenceToolchainSmoke"

  publish:
    name: Publish immutable snapshot
    needs: [build, verify]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Refuse existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.build.outputs.snapshot }}" >/dev/null 2>&1; then
            echo "Release '${{ needs.build.outputs.snapshot }}' already exists; snapshot assets are immutable." >&2
            exit 1
          fi

      - name: Download validated snapshot
        uses: actions/download-artifact@v7
        with:
          name: reference-toolchain-${{ needs.build.outputs.snapshot }}
          path: dist

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Reference C++26 toolchain snapshot.

          - Snapshot: \`${{ needs.build.outputs.snapshot }}\`
          - Source revision: \`${{ needs.build.outputs.revision }}\`
          - Source branch: \`cxx26\`
          - Platform: Linux x86_64
          - Compiler/runtime unit: Clang + libc++ + libc++abi + libunwind
          - Standard modules: packaged libc++ module sources and \`libc++.modules.json\`

          This is an immutable reference snapshot used to validate Miracle, Switch, and Nyx.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.build.outputs.snapshot }}" \
            --verify-tag \
            --prerelease \
            --title "Reference toolchain ${{ needs.build.outputs.snapshot }}" \
            --notes-file release-notes.md \
            dist/*