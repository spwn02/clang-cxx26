name: Reference Toolchain Snapshot

on:
  push:
    tags:
      - "p2996-*"

permissions:
  contents: read

concurrency:
  group: reference-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      snapshot: ${{ steps.metadata.outputs.snapshot }}
      revision: ${{ steps.metadata.outputs.revision }}
      publish: ${{ steps.metadata.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve snapshot metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          revision="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          trigger_tag="$GITHUB_REF_NAME"

          git fetch --depth=1 origin p2996:refs/remotes/origin/p2996
          p2996_tip="$(git rev-parse refs/remotes/origin/p2996)"

          if [[ "$revision" != "$p2996_tip" ]]; then
            echo "Reference-toolchain tags must point at the current p2996 tip." >&2
            echo "tagged revision: $revision" >&2
            echo "p2996 tip:       $p2996_tip" >&2
            exit 1
          fi

          if [[ "$trigger_tag" =~ ^p2996-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            snapshot="$trigger_tag"
            publish=true

            if [[ "$(git cat-file -t "refs/tags/$trigger_tag")" != "tag" ]]; then
              echo "Published reference snapshots require an annotated Git tag." >&2
              exit 1
            fi

            tag_commit="$(git rev-parse "refs/tags/$trigger_tag^{commit}")"

            if [[ "$tag_commit" != "$revision" ]]; then
              echo "Checked-out revision does not match annotated tag target." >&2
              exit 1
            fi

          elif [[ "$trigger_tag" =~ ^p2996-preflight-[A-Za-z0-9._-]+$ ]]; then
            snapshot="p2996-dev-${revision:0:12}"
            publish=false
          else
            echo "Unsupported reference-toolchain tag: $trigger_tag" >&2
            exit 1
          fi

          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Compute compiler source fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail

          source_fingerprint="$(
            {
              for path in \
                llvm \
                clang \
                lld \
                libcxx \
                libcxxabi \
                libunwind \
                runtimes \
                cmake \
                third-party \
                pstl
              do
                if git cat-file -e "HEAD:${path}" 2>/dev/null; then
                  printf '%s %s\n' \
                    "$path" \
                    "$(git rev-parse "HEAD:${path}")"
                fi
              done
            } | sha256sum | cut -d' ' -f1
          )"

          echo "source=$source_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache ninja-build zstd

          python3 -m pip install --user "cmake==4.4.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore staged reference toolchain
        id: stage-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/p2996-stage
          key: p2996-stage-linux-x86_64-v1-${{ steps.fingerprint.outputs.source }}-${{ hashFiles('p2996/toolchain/build-linux-x86_64.sh') }}

      - name: Restore compiler object cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/p2996-ccache
          key: p2996-ccache-linux-x86_64-v1-${{ hashFiles('p2996/toolchain/build-linux-x86_64.sh') }}-${{ steps.fingerprint.outputs.source }}
          restore-keys: |
            p2996-ccache-linux-x86_64-v1-${{ hashFiles('p2996/toolchain/build-linux-x86_64.sh') }}-

      - name: Build reference toolchain
        if: steps.stage-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          P2996_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/p2996-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats

          p2996/toolchain/build-linux-x86_64.sh \
            "$RUNNER_TEMP/p2996-stage" \
            "$RUNNER_TEMP/p2996-build"

          ccache --show-stats

      - name: Save staged reference toolchain
        if: steps.stage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/p2996-stage
          key: ${{ steps.stage-cache.outputs.cache-primary-key }}

      - name: Save compiler object cache
        if: steps.stage-cache.outputs.cache-hit != 'true' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/p2996-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 p2996/toolchain/package.py \
            --stage "$RUNNER_TEMP/p2996-stage" \
            --output "$RUNNER_TEMP/p2996-dist" \
            --snapshot "${{ steps.metadata.outputs.snapshot }}" \
            --revision "${{ steps.metadata.outputs.revision }}" \
            --source-date-epoch "${{ steps.metadata.outputs.source-date-epoch }}"

      - name: Upload preflight snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reference-toolchain-${{ steps.metadata.outputs.snapshot }}
          path: ${{ runner.temp }}/p2996-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Verify relocated Linux x86_64
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build zstd

          python3 -m pip install --user "cmake==4.4.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download candidate snapshot
        uses: actions/download-artifact@v4
        with:
          name: reference-toolchain-${{ needs.build.outputs.snapshot }}
          path: dist

      - name: Verify relocated package
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find dist -maxdepth 1 -name '*.tar.zst' -print -quit)"
          test -n "$archive"

          mkdir -p "$RUNNER_TEMP/p2996-verify"
          tar --use-compress-program=unzstd \
            -xf "$archive" \
            -C "$RUNNER_TEMP/p2996-verify"

          root="$(find "$RUNNER_TEMP/p2996-verify" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"

          # shellcheck disable=SC1090
          source "$root/share/clang-p2996/activate.sh"

          test -x "$CC"
          test -x "$CXX"
          test -x "$P2996_TOOLCHAIN_ROOT/bin/clang-scan-deps"
          test -f "$P2996_TOOLCHAIN_ROOT/share/clang-p2996/manifest.json"

          modules_manifest="$("$CXX" -print-file-name=libc++.modules.json)"
          test -f "$modules_manifest"

          cmake \
            -S p2996/toolchain/smoke \
            -B "$RUNNER_TEMP/p2996-smoke-build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$P2996_CMAKE_TOOLCHAIN_FILE"

          cmake --build "$RUNNER_TEMP/p2996-smoke-build"
          "$RUNNER_TEMP/p2996-smoke-build/P2996ReferenceToolchainSmoke"

  publish:
    name: Publish immutable snapshot
    needs: [build, verify]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refuse existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.build.outputs.snapshot }}" >/dev/null 2>&1; then
            echo "Release '${{ needs.build.outputs.snapshot }}' already exists; snapshot assets are immutable." >&2
            exit 1
          fi

      - name: Download validated snapshot
        uses: actions/download-artifact@v4
        with:
          name: reference-toolchain-${{ needs.build.outputs.snapshot }}
          path: dist

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Reference C++26 toolchain snapshot.

          - Snapshot: \`${{ needs.build.outputs.snapshot }}\`
          - Source revision: \`${{ needs.build.outputs.revision }}\`
          - Source branch: \`p2996\`
          - Platform: Linux x86_64
          - Compiler/runtime unit: Clang + libc++ + libc++abi + libunwind
          - Standard modules: packaged libc++ module sources and \`libc++.modules.json\`

          This is an immutable reference snapshot used to validate Miracle, Switch, and Nyx.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.build.outputs.snapshot }}" \
            --verify-tag \
            --prerelease \
            --title "Reference toolchain ${{ needs.build.outputs.snapshot }}" \
            --notes-file release-notes.md \
            dist/*

