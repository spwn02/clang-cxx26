# The <meta> reflection library (P2996 and friends) is a C++26 facility and is
# only supported when compiling as C++26 or C++29 (token sequences, P4380, are C++29 only and mark themselves UNSUPPORTED in C++26); skip the whole directory otherwise so
# that per-standard lit runs don't report the tests as failures.
if "c++26" not in config.available_features and "c++29" not in config.available_features:
    config.unsupported = True
